# 《创世》nginx 生产模板。替换 <your-domain.example.com> 后安装。
server_tokens off;
include /etc/nginx/snippets/cloudflare-realip.conf;

map $host $genesis_valid_host {
    default 0;
    <your-domain.example.com> 1;
    www.<your-domain.example.com> 1;
}
limit_req_zone $binary_remote_addr zone=genesis_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=genesis_api:10m rate=30r/s;

upstream genesis_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name <your-domain.example.com> www.<your-domain.example.com>;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://<your-domain.example.com>$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name <your-domain.example.com> www.<your-domain.example.com>;

    if ($genesis_valid_host = 0) { return 444; }
    if ($host = www.<your-domain.example.com>) { return 308 https://<your-domain.example.com>$request_uri; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    ssl_certificate /etc/letsencrypt/live/<your-domain.example.com>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain.example.com>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://discord.com; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.discordapp.com; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;

    location /_next/static/ {
        alias /srv/genesis/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /images/ {
        alias /srv/genesis/current/public/images/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location ~ ^/api/auth/sign-in/(email|social)$ {
        limit_req zone=genesis_auth burst=3 nodelay;
        proxy_pass http://genesis_app;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location ~ ^/api/(chat|messages/[^/]+/variants|chapters/[^/]+/settle|genesis/tasks/[^/]+/events|rewrites/[^/]+/events)$ {
        proxy_pass http://genesis_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /api/worlds/import {
        limit_req zone=genesis_api burst=10 nodelay;
        client_max_body_size 10m;
        proxy_pass http://genesis_app;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        limit_req zone=genesis_api burst=30 nodelay;
        proxy_pass http://genesis_app;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://genesis_app;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
