# 《创世》nginx server 块 —— 2C2G 单机(SSE 直通 + body 上限 + 静态直出)
# 安放:/etc/nginx/sites-available/genesis.conf → ln -s 到 sites-enabled/
# 占位符:替换所有 <> 包裹的值(server_name、证书路径)后 nginx -t 再 reload。
#
# 与代码强耦合的两处,改代码时必须同步:
#   1. SSE 路由正则(见下),新增流式端点要加进来;
#   2. /api/worlds/import 的 10m 上限,对齐应用层
#      src/app/api/worlds/import/route.ts 的 MAX_BODY_BYTES(10MB)。

upstream genesis_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain.example.com>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx <1.25.1 改用:listen 443 ssl http2;(删除本行)
    server_name <your-domain.example.com>;

    # 证书(以 certbot 默认路径为例)
    ssl_certificate     /etc/letsencrypt/live/<your-domain.example.com>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain.example.com>/privkey.pem;

    # ── 多人化 Phase A 落地前必开其一(当前应用无登录) ──────────
    # auth_basic "Genesis";
    # auth_basic_user_file /etc/nginx/genesis.htpasswd;
    # 或 IP 白名单:
    # allow 203.0.113.0/24;
    # deny all;

    # 全局请求体上限(设计 §4:不逐路由铺开,统一 1m)
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ── 静态直出(不过 Node,省 CPU/内存)────────────────────────
    # /_next/static 内容寻址,可放心 immutable 一年
    location /_next/static/ {
        alias /srv/genesis/app/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /images/ {
        alias /srv/genesis/app/public/images/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── SSE 路由:关缓冲 + 长读超时 ─────────────────────────────
    # 端点清单(与 src/app/api 一一对应):
    #   POST /api/chat                          叙事流(narratorSSE)
    #   POST /api/messages/{id}/variants        变体重掷流
    #   POST /api/chapters/{id}/settle          结算进度流
    #   GET  /api/genesis/tasks/{id}/events     创世任务进度流
    #   GET  /api/rewrites/{id}/events          改写任务进度流
    # 应用已发 X-Accel-Buffering: no,此处显式关缓冲为双保险。
    # 读超时 900s ≥ 设计要求 600s;应用叙事流自带约 100s 间隔心跳。
    location ~ ^/api/(chat|messages/[^/]+/variants|chapters/[^/]+/settle|genesis/tasks/[^/]+/events|rewrites/[^/]+/events)$ {
        proxy_pass http://genesis_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ── 世界导入:唯一放宽 body 的路由(10m,双层防线)──────────
    location = /api/worlds/import {
        client_max_body_size 10m;
        proxy_pass http://genesis_app;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ── 其余全部走 Node ─────────────────────────────────────────
    location / {
        proxy_pass http://genesis_app;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
